[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valen"
version = "0.1.0"
description = "Neuro-symbolic structural-invariant verifier: multi-language SAST + autonomous red-team agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VALEN contributors" }]
keywords = ["security", "sast", "taint-analysis", "red-team", "cvss", "sarif"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-solidity",
    "z3-solver",
    "requests",
]

[project.optional-dependencies]
# LLM-assisted specification mining (optional).
llm = ["litellm"]
# Binary analysis adapter (optional, heavy).
angr = ["angr"]
# Active Directory analysis (GPP decryption, collectors).
ad = ["pycryptodome", "impacket", "ldap3"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "litellm",
]
# Building & publishing distributions.
release = ["build", "twine"]

[project.scripts]
valen = "valen.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/valen"

[tool.setuptools.packages.find]
include = ["valen*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
# Experiment scripts (benchmarks), generated docs and vendored dirs are not linted.
exclude = ["benchmarks", "core", "docs", "scripts", "formal", "viz", "examples", ".venv"]

[tool.ruff.lint]
# Correctness-focused: pyflakes + pycodestyle errors. Import sorting is opt-in
# (`ruff check --select I --fix`) to avoid a repo-wide reorder in this pass.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # module-level imports after sys.path tweaks (benchmarks)

[tool.coverage.run]
branch = true
source = ["valen", "agent"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

