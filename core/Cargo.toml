[package]
name = "valen-core"
version = "0.1.0"
edition = "2021"
description = "Numeric core for VALEN: spectral, geometric, topological and algebraic kernels."

[lib]
name = "valen_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
minilp = "0.2"

[profile.release]
lto = true
